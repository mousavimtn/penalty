name: Deploy from zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          unzip -q penalty-game.zip -d extracted
          INDEX=$(find extracted -path '*/public/index.html' | head -n 1)
          echo "SITE=$(dirname "$INDEX")" >> "$GITHUB_ENV"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE }}

      - id: deployment
        uses: actions/deploy-pages@v4
