name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Prepare Web Files
      run: |
        mkdir -p www
        cp index.html www/
        # کپی کردن عکس کورتوا (webp)
        if [ -f courtois.webp ]; then cp courtois.webp www/; fi
        # کپی کردن لوگو در صورت وجود
        if [ -f logo.png ]; then cp logo.png www/; fi

    - name: Initialize Android Project
      run: |
        # اسم اپ روی گوشی: پنالتی محمد
        npx cap init "پنالتی محمد" "com.smohammad.penalty" --web-dir=www
        npx cap add android

    - name: Generate Custom Football Icon
      run: |
        mkdir -p assets
        # طراحی پس‌زمینه آیکون (سرمه‌ای)
        cat << 'EOF' > assets/icon-background.svg
        <svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
          <rect width="1024" height="1024" fill="#0d1b3e"/>
        </svg>
        EOF
        # طراحی توپ فوتبال (طلایی)
        cat << 'EOF' > assets/icon-foreground.svg
        <svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
          <circle cx="512" cy="512" r="350" fill="#ffffff" stroke="#d4af37" stroke-width="30"/>
          <polygon points="512,300 600,370 570,470 450,470 420,370" fill="#0d1b3e"/>
          <circle cx="320" cy="400" r="60" fill="#0d1b3e"/>
          <circle cx="704" cy="400" r="60" fill="#0d1b3e"/>
          <circle cx="320" cy="650" r="60" fill="#0d1b3e"/>
          <circle cx="704" cy="650" r="60" fill="#0d1b3e"/>
          <circle cx="512" cy="750" r="60" fill="#0d1b3e"/>
        </svg>
        EOF
        # طراحی صفحه لودینگ (Splash)
        cat << 'EOF' > assets/splash.svg
        <svg width="2732" height="2732" xmlns="http://www.w3.org/2000/svg">
          <rect width="2732" height="2732" fill="#0d1b3e"/>
          <g transform="translate(854, 854)">
            <circle cx="512" cy="512" r="350" fill="#ffffff" stroke="#d4af37" stroke-width="30"/>
            <polygon points="512,300 600,370 570,470 450,470 420,370" fill="#0d1b3e"/>
            <circle cx="320" cy="400" r="60" fill="#0d1b3e"/>
            <circle cx="704" cy="400" r="60" fill="#0d1b3e"/>
            <circle cx="320" cy="650" r="60" fill="#0d1b3e"/>
            <circle cx="704" cy="650" r="60" fill="#0d1b3e"/>
            <circle cx="512" cy="750" r="60" fill="#0d1b3e"/>
          </g>
        </svg>
        EOF
        # تبدیل SVG به PNG
        sudo apt-get update && sudo apt-get install -y librsvg2-bin
        rsvg-convert -w 1024 -h 1024 assets/icon-background.svg -o assets/icon-background.png
        rsvg-convert -w 1024 -h 1024 assets/icon-foreground.svg -o assets/icon-foreground.png
        rsvg-convert -w 2732 -h 2732 assets/splash.svg -o assets/splash.png

    - name: Apply Icons to Android Project
      run: |
        npm install @capacitor/assets
        npx capacitor-assets generate --android
        npx cap sync android

    - name: Build APK with Gradle
      working-directory: ./android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Penalty-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
